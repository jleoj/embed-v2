<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Embedder</title>
  <link rel="icon" href="src/images/favicon.png" type="image/png">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      height: 100vh;
    }
    h1 {
      margin-top: 20px;
    }
    #controls {
      margin: 20px 0;
      display: flex;
      gap: 10px;
    }
    input {
      padding: 10px;
      width: 300px;
      border: none;
      border-radius: 5px;
    }
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background-color: #0078d7;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #005fa3;
    }
    #frameContainer {
      position: relative;
      width: 90%;
      height: 70vh;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      background-color: #1e1e1e;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    #errorMsg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #ccc;
      padding: 20px;
    }
  </style>
   <script>
    const panicRedirect = "https://sjusd.instructure.com"; // Change this to your safe site

    document.addEventListener("keydown", function (event) {
      // Trigger when both Ctrl and Shift are pressed
      if (event.ctrlKey && event.shiftKey && !event.altKey && !event.metaKey) {
        window.location.replace(panicRedirect);
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
</head>
<body>
  <h1>Website Embedder</h1>
  <div id="controls">
    <input type="text" id="urlInput" placeholder="Enter website URL (e.g. https://example.com)">
    <button onclick="loadWebsite()">Load</button>
    <button onclick="goFullscreen()">Fullscreen</button>
  </div>
  <div id="frameContainer">
    <iframe id="embedFrame" src=""></iframe>
    <div id="errorMsg">Enter a URL above and click "Load".</div>
  </div>

  <script>
    function loadWebsite() {
      const urlInput = document.getElementById("urlInput").value.trim();
      const frame = document.getElementById("embedFrame");
      const errorMsg = document.getElementById("errorMsg");

      if (!urlInput) {
        errorMsg.textContent = "Please enter a website URL!";
        frame.style.display = "none";
        return;
      }

      let formattedUrl = urlInput;
      if (!/^https?:\/\//i.test(formattedUrl)) {
        formattedUrl = "https://" + formattedUrl;
      }

      frame.src = formattedUrl;
      frame.style.display = "block";
      errorMsg.textContent = "Loading...";

      // Detect if loading fails (due to X-Frame-Options)
      frame.onload = () => {
        errorMsg.textContent = "";
      };

      frame.onerror = () => {
        errorMsg.textContent =
          "This site cannot be embedded (blocked by the website itself). Try another URL.";
        frame.style.display = "none";
      };

      // Fallback if the site blocks iframe embedding
      setTimeout(() => {
        if (frame.contentWindow === null) {
          errorMsg.textContent =
            "This site cannot be embedded (blocked by the website itself). Try another URL.";
          frame.style.display = "none";
        }
      }, 2000);
    }

    function goFullscreen() {
      const frame = document.getElementById("embedFrame");
      if (frame.requestFullscreen) {
        frame.requestFullscreen();
      } else if (frame.webkitRequestFullscreen) {
        frame.webkitRequestFullscreen();
      } else if (frame.msRequestFullscreen) {
        frame.msRequestFullscreen();
      }
    }
  </script>
<div id="controls">
  <button id="cloakGoogle">Cloak as Google</button>
  <button id="cloakClassroom">Cloak as Classroom</button>
  <button id="cloakDrive">Cloak as Drive</button>
  <button id="cloakCanvas">Cloak as Canvas</button>
  <button id="resetCloak">Reset Cloak</button>
  <button id="toggleDevtools">DevTools</button>
</div>

<script>
let erudaEnabled = false;

document.getElementById("toggleDevtools").addEventListener("click", () => {
    if (!erudaEnabled) {
        eruda.init();
        eruda.show();
        erudaEnabled = true;
    } else {
        eruda.destroy();
        erudaEnabled = false;
    }
});
</script>

<script>
  // --- TAB CLOAKER FEATURE ---

  const cloaks = {
    "google": {
      title: "Google",
      favicon: "https://www.google.com/favicon.ico"
    },
    "google classroom": {
      title: "Google Classroom",
      favicon: "https://ssl.gstatic.com/classroom/favicon.png"
    },
    "google drive": {
      title: "Home - Google Drive",
      favicon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png"
    },
    "canvas": {
      title: "Dashboard",
      favicon: "https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico"
    },
    "default": {
      title: document.title,
      favicon: document.querySelector("link[rel*='icon']")?.href || ""
    }
  };

  function setCloak(option) {
    const choice = cloaks[option.toLowerCase()];
    if (!choice) return console.warn("Invalid cloak option:", option);

    // Update the page title
    document.title = choice.title;

    // Update the favicon
    let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
    link.type = 'image/x-icon';
    link.rel = 'shortcut icon';
    link.href = choice.favicon;
    document.head.appendChild(link);
  }

  // Button bindings
  document.getElementById("cloakGoogle").addEventListener("click", () => setCloak("google"));
  document.getElementById("cloakClassroom").addEventListener("click", () => setCloak("google classroom"));
  document.getElementById("cloakDrive").addEventListener("click", () => setCloak("google drive"));
  document.getElementById("cloakCanvas").addEventListener("click", () => setCloak("canvas"));
  document.getElementById("resetCloak").addEventListener("click", () => setCloak("default"));
</script>


</body>
